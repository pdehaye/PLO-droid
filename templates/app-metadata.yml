# Template for metadata/<applicationId>.yml
# Copy to metadata/<applicationId>.yml (e.g. metadata/ch.planlesouates.agenda.yml)
# and fill in. Full reference: https://f-droid.org/docs/Build_Metadata_Reference/
#
# Localised texts (title, short/full description, screenshots) can also live
# in metadata/<applicationId>/<locale>/ (fastlane layout), e.g.
#   metadata/<applicationId>/fr-CH/title.txt
#   metadata/<applicationId>/fr-CH/short_description.txt
#   metadata/<applicationId>/fr-CH/full_description.txt
#   metadata/<applicationId>/fr-CH/images/phoneScreenshots/1.png

